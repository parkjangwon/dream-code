name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  compatibility:
    name: Compatibility check (Node ${{ matrix.node-version }})
    runs-on: ${{ vars.DREAM_RELEASE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

  release:
    name: Build and publish release package
    needs: compatibility
    runs-on: ${{ vars.DREAM_RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Smoke check
        run: |
          mkdir -p release
          node dist/src/cli.js smoke --json > release/smoke.json

      - name: Release readiness
        run: node dist/src/cli.js release-check --json > release/release-check.json

      - name: Pack dry run
        run: npm pack --dry-run --json > release/pack-dry-run.json

      - name: Pack npm tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
          shasum -a 256 release/*.tgz > release/SHA256SUMS

      - name: Generate artifact attestation
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: release/*.tgz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tgz release/*.json release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release/*.tgz release/*.json release/SHA256SUMS --generate-notes --title "$RELEASE_TAG"
          fi
